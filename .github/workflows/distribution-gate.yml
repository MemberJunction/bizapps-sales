name: Distribution Gate

# Catches SQL carrying a placeholder `mj app install` cannot resolve (Skyway leaves unknown
# ones untouched, so they ship as literal strings rather than erroring). Metadata currency is
# not gated here: PRs contribute JSON only, and the build engineer generates one consolidated
# Metadata_Sync per release. Reasoning: scripts/check-distribution-seed.mjs, docs/PUBLISHING.md,
# MJ/metadata/CLAUDE.md §1b and §10.

on:
  workflow_dispatch:
  # `push` as well as `pull_request`: the PR trigger alone would let a direct commit to next/main
  # land unshipped metadata without the gate ever running.
  push:
    branches: [next, main]
    paths:
      - 'metadata/**'
      - 'migrations/**'
      - 'migrations-teardown/**'
      - 'mj-app.json'
      - 'scripts/check-distribution-seed.mjs'
      - '.github/workflows/distribution-gate.yml'
  pull_request:
    branches: [next, main]
    paths:
      - 'metadata/**'
      - 'migrations/**'
      - 'migrations-teardown/**'
      - 'mj-app.json'
      - 'scripts/check-distribution-seed.mjs'
      - '.github/workflows/distribution-gate.yml'

jobs:
  distribution-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`: the gate is Node stdlib only, deliberately, so a dependency problem can never
      # be the reason nobody finds out the app does not install.
      - name: Check shipped SQL placeholders
        run: npm run lint:distribution

      - name: Check the gate itself still fires
        run: node scripts/check-distribution-seed.spec.mjs
