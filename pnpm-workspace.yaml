# pnpm workspace definition. The npm `workspaces` array in package.json is left in
# place because other tooling still reads it (the OpenApp install engine's
# findWorkspacePackageJsonFiles, and the publish workflow's jq steps) — pnpm itself
# ignores it and uses this file. Keep the two glob lists in sync.

# LOAD-BEARING. pnpm 10 defaults this to false, which makes internal deps declared at
# a plain version range (here ^x.y.z) resolve from the REGISTRY instead of linking to
# the local package. For an unpublished version that fails loudly; for a published one
# it silently installs a stale copy. This repo declares its own workspace packages by
# caret range rather than `workspace:`, so without this every workspace link becomes a
# registry download.
linkWorkspacePackages: true

# Peer handling (strict-peer-dependencies, auto-install-peers) lives in .npmrc.

# pnpm 10 does not run dependency build scripts unless they are allowlisted here.
# Anything omitted installs without its native/postinstall step and fails later at
# runtime rather than at install. Kept verbatim in sync with the MJ core allowlist
# rather than trimmed to today's tree: entries for absent packages are inert, and a
# trimmed list silently regresses the moment a transitive dep reappears.
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@google/genai'
  - '@parcel/watcher'
  - '@zoom/rtms'
  - browser-tabs-lock
  - core-js
  - core-js-pure
  - esbuild
  - isolated-vm
  - lmdb
  - msgpackr-extract
  - oracledb
  - protobufjs
  - rete
  - sharp
  - tesseract.js

packages:
  - 'packages/*'

# Dependency overrides. They live here, not under package.json `pnpm.overrides`: pnpm 10.33
# warns that it no longer reads the `pnpm` field there (it still applies overrides from it today,
# but the field is deprecated). npm reads neither location. Overrides are workspace-local and never
# published. @memberjunction/core and @memberjunction/global carry the same caret floor as every
# other MJ range so the graph resolves one copy of each (CLAUDE.md, "MemberJunction versions").
#
# @mj-biz-apps/common-entities IS PINNED BY THE OVERRIDE, AND ONLY BY THE OVERRIDE.
#
# WHY THE MANIFESTS DECLARE A RANGE RATHER THAN AN EXACT PIN. Two exact pins on one package,
# declared by two different repos, IS the golive#258 failure: orders shipped orders-entities 5.14.0
# while sales still pinned 5.13.0, no resolver can satisfy two different exact pins from one copy,
# and the second copy re-ran every module-scope @RegisterClass in it. A SIBLING consumer that pins
# exactly is correct only while its number happens to equal the owner's, and nothing maintains that
# equality -- it is a claim that was true when someone checked it. So every manifest here asks for
# '^5.44.0': 5.44.0 is the floor where BusinessTimeZoneEngine exists, '<6.0.0' is the ceiling, and
# orders' own '>=5.44.0' can always dedupe onto it however far orders moves.
#
# Measured on 2026-09-21, so the size of the hole is on record rather than assumed: pnpm 10.33 and
# npm 11 BOTH dedupe that range onto a pinned sibling whenever one is in the graph. Resolve
# orders-entities on its own, with no sibling to dedupe onto, and the same pnpm picks the newest
# published. A single copy is therefore a resolver HEURISTIC, not a constraint -- and a duplicate
# @mj-biz-apps/common-entities means two BusinessTimeZoneEngine singletons, i.e. two answers to what
# day it is, which is the whole of bc-aidp-next-golive#168 arriving through the dependency graph
# instead of through the code.
#
# THE OVERRIDE is what makes it a constraint. It replaces EVERY request for the three common-*
# packages in the graph -- including the family's own exact self-pins (common-ng@X and
# common-activity-sync@X each declare common-entities@X exactly) -- with one range, so the resolver
# has a single range to satisfy and resolves one copy of each. ALL THREE are overridden together:
# overriding only common-entities would let common-ng move to a release that hard-requires a later
# common-entities than the override allows.
#
# IT IS A CARET, NOT AN EXACT PIN. The version the suite is measured against is fixed by
# pnpm-lock.yaml, which CI installs frozen; the override only governs what a re-resolution may
# pick. An exact pin here held this repo on common 5.46.3 after common had fixed its own install
# (5.46.3's Tags metadata cannot be pushed to an MJ v6 host), and nothing prompted anyone to move
# it. The floor is common's first release with bizapps-party-field and the Person.EmailDomain /
# Organization.WebsiteDomain columns the Deal form's pickers query (bc-aidp-next-golive#372).
# What travels to a consumer is the range in each package.json, which is what lets a host dedupe
# instead of nesting a second copy.
overrides:
  '@angular/animations': '21.1.3'
  '@angular/build': '21.1.3'
  '@angular/cli': '21.1.3'
  '@angular/common': '21.1.3'
  '@angular/compiler': '21.1.3'
  '@angular/compiler-cli': '21.1.3'
  '@angular/core': '21.1.3'
  '@angular/forms': '21.1.3'
  '@angular/localize': '21.1.3'
  '@angular/platform-browser': '21.1.3'
  '@angular/platform-browser-dynamic': '21.1.3'
  '@angular/router': '21.1.3'
  '@angular-devkit/build-angular': '21.1.3'
  '@memberjunction/core': '^6.1.6'
  '@memberjunction/global': '^6.1.6'
  '@mj-biz-apps/common-entities': '^5.56.0'
  '@mj-biz-apps/common-ng': '^5.56.0'
  '@mj-biz-apps/common-activity-sync': '^5.56.0'
  graphql: '16.14.2'
  type-graphql: '2.0.0-beta.3'
  reflect-metadata: '0.2.2'
  '@types/node': '^22.20.1'
  zod: '^3.25.76'
